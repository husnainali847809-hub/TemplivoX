name: Rebuild TemplivoX site

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/rebuild-site.yml"

permissions:
  contents: write

concurrency:
  group: templivox-site-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF rendering dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install reportlab python-docx openpyxl pillow

      - name: Rebuild generated website files
        run: python tools/build_site.py .

      - name: Commit rebuilt pages, sitemap and metadata
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "Rebuild TemplivoX with corrected SEO URLs"
            git push
          else
            echo "No generated changes to commit."
          fi
